<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tokenmon Terminal</title>
<link rel="stylesheet" href="vendor/xterm.css">
<style>
  /* Fully transparent so the panel's HUD blur shows through. ANSI
     background-colour codes and reverse-video are stripped server-side
     in ``ansi_filter.AnsiBgStripper`` so we don't get blocky callouts
     against the blur. WKWebView is non-opaque on the Python side;
     ``allowTransparency: true`` on the xterm.js side lets the
     alpha-zero theme.background compose with what's behind the canvas. */
  html, body { margin: 0; padding: 0; height: 100%; background: transparent; overflow: hidden; }
  #term { position: absolute; inset: 0; padding: 8px; box-sizing: border-box; background: transparent; }
  .xterm, .xterm-viewport, .xterm-screen { background: transparent !important; }
</style>
</head>
<body>
<div id="term"></div>
<script src="vendor/xterm.js"></script>
<script src="vendor/xterm-addon-fit.js"></script>
<script src="main.js"></script>
</body>
</html>
