[project]
name = "tokenmon"
version = "0.1.0"
description = "Local Anthropic API token tracker with macOS menubar"
requires-python = ">=3.13,<3.14"
dependencies = [
    "httpx[http2]>=0.27",
    "starlette>=0.40",
    "uvicorn>=0.32",
    "rumps>=0.4.0",
    "pyobjc-core>=10.3",
    "pyobjc-framework-Cocoa>=10.3",
    "pyobjc-framework-Quartz>=10.3",
    "pyobjc-framework-Vision>=10.3",
    "click>=8.1",
]

[project.scripts]
tokenmon = "tokenmon.cli:main"
tokenmon-proxy = "tokenmon.proxy:main"
tokenmon-menubar = "tokenmon.menubar:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tokenmon"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "py2app>=0.28",
    # py2app 0.28 still feeds install_requires into setuptools.setup();
    # setuptools>=80 rejects it. Pin until py2app catches up.
    "setuptools<80",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
